name = "book-inventory"
main = "src/server/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Aliases to stub Bun native modules when compiling for Cloudflare Workers
[alias]
"bun:sqlite" = "./src/db/bun-sqlite-stub.ts"

# Serve frontend static assets compiled with Vite
[assets]
directory = "./dist"
binding = "ASSETS"

# Cloudflare D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "book-inventory-db"
database_id = "32900db3-750f-46c5-9eb8-f368d298481d"

# Cloudflare R2 Storage binding for book covers
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "book-inventory-covers"

# Cron Trigger: alarm harian sampah data-uji di production D1.
# 17:00 UTC = 00:00 WIB. Handler: `scheduled` di src/server/worker.ts.
[triggers]
crons = ["0 17 * * *"]

# Environment clone testing: inv-aw
[env.inv-aw]
name = "inv-aw"

[env.inv-aw.vars]
BETTER_AUTH_URL = "https://inv-aw.tech1solusi.workers.dev"

[[env.inv-aw.d1_databases]]
binding = "DB"
database_name = "inv-aw-db"
database_id = "dd33f93e-e917-44b9-9813-32a9fe821ed1"

[[env.inv-aw.r2_buckets]]
binding = "BUCKET"
bucket_name = "inv-aw-covers"
