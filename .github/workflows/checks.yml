# Quality gates: type-check, lint, ukuran file, kedalaman import, kontrak API klien→route,
# pairing route-test, validator, dead-export, canonical-helper, single-writer, d1-write,
# d1-error-mapping, test-isolation, doc-number, lane-ownership, query plan, build, dan test.
# Berjalan di setiap push dan pull request — kepatuhan AGENTS.md aturan 1
# tidak lagi bergantung pada disiplin agen saja.

name: checks

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # fetch-depth 0 (riwayat penuh) wajib agar gate diff-scoped
          # (no-any, canonical-helpers) bisa `git diff <base>...HEAD`.
          fetch-depth: 0

      # WAJIB sama dengan field packageManager (AGENTS.md aturan 5):
      # bun lebih baru menulis lockfile v2 yang gagal dibaca bun 1.2.15.
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type safety verification
        run: bun run type-check

      - name: Code linting
        run: bun run lint

      - name: File-size gate
        # --all = full-tree: pada checkout CI `git status` kosong sehingga mode
        # file-yang-diubah (pre-commit) akan selalu lolos tanpa memeriksa apa pun.
        run: bun run check:file-size --all

      - name: Import-depth gate
        run: bun run check:imports

      - name: API-contract gate
        # Setiap literal /api/... di klien wajib cocok dengan route terdaftar,
        # dan portal publik hanya boleh memanggil /api/public/*.
        run: bun run check:api-contract

      - name: Route-test pairing gate
        run: bun run check:route-tests

      - name: Validators gate
        run: bun run check:validators

      - name: Dead-export gate
        run: bun run check:dead

      - name: No-any gate
        # Base ref PR: gate memeriksa baris `+` dari diff merge-base, bukan diff lokal kosong.
        env:
          GATE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run check:no-any

      - name: Canonical-helper gate
        env:
          GATE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run check:canonical-helpers

      - name: Single-writer gate
        # Tabel struk & stok seragam hanya dirakit modul pemiliknya (AGENTS.md §0.4/§0.7).
        run: bun run check:single-writer

      - name: D1 write-discipline gate
        # Static §10 gate: INSERT >10 baris per statement atau Promise.all untuk tulis.
        run: bun run check:d1-writes

      - name: D1 error-mapping gate
        # Statis §10.4: berkas pemakai runWriteBatch() wajib memetakan error constraint D1 ke 4xx.
        run: bun run check:d1-error-mapping

      - name: Test-isolation gate
        # Static §6 gate: tidak ada binding D1 di test + preload test/setup.ts utuh.
        run: bun run check:test-isolation

      - name: Doc-number gate
        # Statis: setiap prefix documentNumber() wajib terdaftar + kolomnya UNIQUE (§8/§10).
        run: bun run check:doc-numbers

      - name: Lane-ownership gate
        # Self-skip tanpa manifest lane (docs/agents/lanes.json gitignored) → CI tetap hijau.
        run: bun run check:lanes

      - name: Query plan gate
        run: bun run check:plans

      - name: Production build check
        run: bun run build

      - name: Test suite
        run: bun test
